# 템플릿 원본 저장소 전용 검사.
# 이 템플릿으로 만든 새 저장소에서는 실행되지 않고, groundwork 스킬이 세팅 중에 삭제한다.
name: skill-check

on:
  push:
    branches: [main]
    paths:
      - ".claude/skills/**"
      - ".template/**"
      - ".github/workflows/skill-check.yml"
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".template/**"
      - ".github/workflows/skill-check.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'steves460ng/groundwork'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check skills
        run: python3 .template/check.py | tee -a "$GITHUB_STEP_SUMMARY"
