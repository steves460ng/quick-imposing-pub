name: 버그 제보
description: 프로그램이 잘못 동작하거나 오류가 날 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        이 저장소는 **공개**입니다. 고객 자료나 개인정보가 담긴 PDF·화면 캡처는 올리지 마세요.
        필요하면 내용을 지운 견본 파일을 올려 주세요.
  - type: input
    id: version
    attributes:
      label: quick-imposing 버전
      description: 프로그램 제목 표시줄이나 정보 화면에 나오는 버전
      placeholder: 예) 0.5.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 버전
      placeholder: 예) Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 나온 오류 메시지가 있으면 그대로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 일어나게 하는 순서
      placeholder: |
        1. 작업 프로그램에서 ...을 연다
        2. ...을 누른다
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 원래 어떻게 되어야 하나요?
  - type: textarea
    id: files
    attributes:
      label: 참고 파일·화면
      description: 견본 카드 PDF, 판 템플릿, 화면 캡처 등을 끌어다 놓을 수 있습니다. (공개되니 주의)
